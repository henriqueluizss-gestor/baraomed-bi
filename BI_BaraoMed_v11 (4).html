<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1E2761">
<title>BI · BarãoMed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-snap-type:y mandatory;overflow-y:scroll;scrollbar-width:none;}
html::-webkit-scrollbar{display:none;}
body{font-family:'Inter',sans-serif;background:#1E2761;}
.slide{height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 18px 52px;overflow:hidden;}
.slide-dark{background:linear-gradient(145deg,#1E2761 0%,#2d3e8a 55%,#1a5276 100%);color:#fff;}
.slide-light{background:#F0F4FB;color:#1E2761;overflow-y:auto;}
.nav-dots{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;}
.ndot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .3s;border:none;padding:0;}
.ndot.active{background:#fff;transform:scale(1.4);}
.nd-dark .ndot{background:rgba(30,39,97,.3);}
.nd-dark .ndot.active{background:#1E2761;transform:scale(1.4);}
/* SELETOR DE MÊS */
.mes-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:6px;width:100%;max-width:420px;}
.mes-nav{display:flex;align-items:center;gap:8px;}
.mes-btn{background:rgba(255,255,255,.1);border:1px solid rgba(202,220,252,.2);color:rgba(202,220,252,.7);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0;line-height:1;}
.mes-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
.mes-btn:disabled{opacity:.2;cursor:default;}
.mes-label{font-size:12px;color:#fff;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;min-width:80px;text-align:center;}
.mes-pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.mes-pill{background:rgba(255,255,255,.08);border:1px solid rgba(202,220,252,.15);color:rgba(202,220,252,.5);font-size:9px;font-weight:700;padding:3px 9px;border-radius:12px;cursor:pointer;transition:all .2s;letter-spacing:.5px;}
.mes-pill.active{background:rgba(74,144,217,.4);border-color:rgba(74,144,217,.7);color:#fff;}
.mes-pill:hover:not(.active){background:rgba(255,255,255,.15);color:#fff;}
/* LOGO */
.logo{height:28px;margin:4px 0 4px;object-fit:contain;display:block;}
/* KPI */
.kpi-big{display:flex;align-items:baseline;gap:6px;justify-content:center;margin-bottom:5px;}
.kpi-n{font-size:clamp(40px,12vw,62px);font-weight:800;line-height:1;color:#fff;}
.kpi-u{font-size:13px;color:rgba(202,220,252,.5);}
/* BARRA */
.bar-box{width:100%;max-width:420px;background:rgba(255,255,255,.08);border:1px solid rgba(202,220,252,.15);border-radius:12px;padding:9px 14px;margin-bottom:7px;}
.bar-hd{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;}
.bar-lbl{color:rgba(202,220,252,.5);text-transform:uppercase;letter-spacing:1px;}
.bar-val{color:rgba(202,220,252,.9);font-weight:700;}
.bar-track{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 1.2s ease;background:linear-gradient(90deg,#4A90D9,#27AE60);}
.bar-fill.done{background:linear-gradient(90deg,#27AE60,#7fff7f);}
/* CARDS OPERADORES */
.ops{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:100%;max-width:420px;margin-bottom:7px;}
.op{background:rgba(255,255,255,.1);border:1px solid rgba(202,220,252,.2);border-radius:12px;padding:9px 11px;text-align:center;flex:1;min-width:80px;max-width:120px;transition:all .4s;}
.op.done{background:rgba(39,174,96,.2);border-color:rgba(39,174,96,.45);}
.op.part{background:rgba(74,144,217,.2);border-color:rgba(74,144,217,.45);}
.op-nm{font-size:10px;color:rgba(202,220,252,.7);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.op-pct{font-size:clamp(20px,7vw,27px);font-weight:800;color:#fff;line-height:1.1;margin:2px 0 1px;}
.op-sub{font-size:10px;color:rgba(202,220,252,.7);font-weight:600;}
.op-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:4px;}
.op-bf{height:100%;border-radius:2px;transition:width .8s;}
/* EVOLUÇÃO */
.evol-box{width:100%;max-width:420px;background:rgba(255,255,255,.07);border:1px solid rgba(202,220,252,.12);border-radius:12px;padding:9px 13px;}
.evol-title{font-size:9px;color:rgba(202,220,252,.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;}
.evol-chart{position:relative;height:80px;}
.evol-empty{text-align:center;color:rgba(202,220,252,.28);font-size:10px;padding:16px 0;}
/* SLIDE 2 */
.s2w{width:100%;max-width:480px;overflow-y:auto;max-height:calc(100svh - 108px);}
.s2w::-webkit-scrollbar{display:none;}
.s2-hd{font-size:10px;color:rgba(202,220,252,.5);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;text-align:center;}
.gblk{background:rgba(255,255,255,.08);border:1px solid rgba(202,220,252,.15);border-radius:12px;padding:9px 13px;margin-bottom:7px;}
.ghd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.gnm{font-size:10px;font-weight:700;color:rgba(202,220,252,.8);text-transform:uppercase;letter-spacing:.7px;}
.gbadge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;}
.gb-done{background:rgba(39,174,96,.22);color:#7fff7f;}
.gb-part{background:rgba(245,158,11,.22);color:#fcd34d;}
.gb-zero{background:rgba(239,68,68,.18);color:#fca5a5;}
.gb-none{background:rgba(150,150,150,.15);color:rgba(202,220,252,.4);}
.arow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(202,220,252,.07);}
.arow:last-child{border-bottom:none;}
.anm{flex:1;color:rgba(202,220,252,.7);font-size:10px;}
.abar{width:48px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;flex-shrink:0;}
.abf{height:100%;border-radius:2px;}
.acnt{font-size:9px;color:rgba(202,220,252,.5);min-width:34px;text-align:right;flex-shrink:0;font-family:monospace;}
.apct{font-size:10px;font-weight:700;min-width:26px;text-align:right;flex-shrink:0;}
/* SLIDE 3 */
.s3w{width:100%;max-width:480px;overflow-y:auto;max-height:calc(100svh - 52px);padding:12px 0 20px;}
.s3w::-webkit-scrollbar{display:none;}
.h3-top{font-size:13px;font-weight:800;color:#1E2761;margin-bottom:2px;}
.h3-sub{font-size:11px;color:#94A3B8;margin-bottom:12px;}
.htitle{font-size:10px;font-weight:700;color:#6B7A99;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;margin-top:10px;}
/* FILTRO */
.hist-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px;}
.hfpill{background:#EEF2F9;color:#6B7A99;font-size:9px;font-weight:700;padding:3px 9px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:all .2s;}
.hfpill.active{background:#E8F0FE;color:#3B5BDB;border-color:#93C5FD;}
/* RANKING */
.ranking{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.rank-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 1px 4px rgba(30,39,97,.08);}
.rank-medal{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-nome{font-size:13px;font-weight:700;color:#1E2761;}
.rank-bar-t{height:4px;background:#EEF2F9;border-radius:2px;overflow:hidden;margin-top:3px;}
.rank-bar-f{height:100%;border-radius:2px;transition:width .8s;}
.rank-nums{text-align:right;flex-shrink:0;}
.rank-pct{font-size:18px;font-weight:800;color:#1E2761;line-height:1;}
.rank-cnt{font-size:9px;color:#94A3B8;font-family:monospace;}
/* GRÁFICO */
.cbox{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(30,39,97,.08);}
.ctitle{font-size:9px;font-weight:700;color:#6B7A99;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.cwrap{position:relative;height:155px;}
/* SNAP CARDS */
.scard{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(30,39,97,.08);margin-bottom:7px;}
.sc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.sc-dt{font-size:11px;font-weight:700;color:#1E2761;}
.sc-tags{display:flex;gap:4px;flex-wrap:wrap;}
.sc-tag{font-size:9px;color:#94A3B8;background:#F0F4FB;padding:2px 7px;border-radius:9px;}
.sc-tag.comp{background:#E8F0FE;color:#3B5BDB;}
.sc-ops{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.sc-nm{font-size:9px;color:#94A3B8;margin-bottom:1px;font-weight:600;text-transform:uppercase;}
.sc-pct{font-size:18px;font-weight:800;color:#1E2761;line-height:1;}
.sc-cnt{font-size:9px;color:#94A3B8;margin-top:1px;font-family:monospace;}
.sc-dlt{font-size:9px;font-weight:700;margin-top:2px;}
.h-empty{text-align:center;color:#94A3B8;padding:30px 10px;font-size:13px;line-height:1.8;}
.h-empty .ic{font-size:36px;margin-bottom:10px;}
.h-empty strong{color:#1E2761;}
/* STATUS */
#status{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,45,.94);backdrop-filter:blur(12px);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:rgba(202,220,252,.7);z-index:200;padding-bottom:max(6px,env(safe-area-inset-bottom));}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
.sdot.ok{background:#27AE60;animation:sp 2s infinite;}
.sdot.spin{background:#F39C12;animation:sp .5s infinite;}
.sdot.err{background:#E74C3C;}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.3}}
.sbtns{display:flex;gap:5px;align-items:center;}
.ctxt{font-family:monospace;font-size:10px;color:rgba(202,220,252,.4);min-width:26px;}
.sbtn{padding:3px 9px;border-radius:18px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all .2s;}
.sbtn-s{background:rgba(39,174,96,.28);border:1px solid rgba(39,174,96,.38);color:#7fff7f;}
.sbtn-r{background:rgba(74,144,217,.28);border:1px solid rgba(74,144,217,.38);color:#93c5fd;}
/* LOADING */
#ld{position:fixed;inset:0;background:linear-gradient(145deg,#1E2761 0%,#2d3e8a 55%,#1a5276 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .6s;}
#ld.hide{opacity:0;pointer-events:none;}
.ld-logo{height:40px;animation:lf 2s ease-in-out infinite;object-fit:contain;}
@keyframes lf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ld-track{width:150px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;}
.ld-bar{height:100%;background:#4A90D9;border-radius:2px;animation:lb 1.2s ease-in-out infinite;}
@keyframes lb{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.ld-txt{font-size:12px;color:rgba(202,220,252,.55);}
</style>
</head>

</nav>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwnn6iUYWN5glIXWwZGnuD3rSw7FhFqCYZGeuoeRZP6dvIO6VLlH-BUNvIwHggA7ei3iw/exec';
const SKEY     = 'bm_bi_v11_snaps';
const AKEY     = 'bm_bi_v11_auto';
const RSEC     = 300;
const OP_NAMES = {'BARAOMED1':'OCTÁVIO','BARAOMED3':'WANESSA','BARAOMED4':'JÓRGIA'};
const COLS     = ['#4A90D9','#27AE60','#E67E22','#9B59B6'];
const MEDALS   = ['🥇','🥈','🥉'];

let rows=[], abas=[], abaSel='', histFiltro='todos', chartH, chartEvol, busy=false, cd=RSEC, cdT;

function opName(op){ return OP_NAMES[op.trim()]||op.replace('BARAOMED',''); }
function pct(con,tot){ return !tot?0:Math.min(100,Math.round(con/tot*100)); }

// ── NAV SLIDES ───────────────────────────────────────────
const slides=['s0','s1','s2'].map(id=>document.getElementById(id));
const dots=['d0','d1','d2'].map(id=>document.getElementById(id));
function goSlide(i){
  slides[i].scrollIntoView({behavior:'smooth'});
  dots.forEach((d,j)=>d.classList.toggle('active',i===j));
  nav.className='nav-dots'+(i===2?' nd-dark':'');
  if(i===2) renderS3();
}
slides.forEach(s=>new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    const i=slides.indexOf(e.target);
    dots.forEach((d,j)=>d.classList.toggle('active',i===j));
    nav.className='nav-dots'+(i===2?' nd-dark':'');
    if(i===2) renderS3();
  }
}),{threshold:.5}).observe(s));

// ── SELETOR DE MÊS ──────────────────────────────────────
function renderPills(){
  document.getElementById('mes-label').textContent = abaSel||'—';
  document.getElementById('s2-hd').textContent = 'Grupos · '+(abaSel||'—');
  document.getElementById('mes-pills').innerHTML = abas.map(a=>
    `<button class="mes-pill${a===abaSel?' active':''}" onclick="selecionarAba('${a}')">${a}</button>`
  ).join('');
  const idx=abas.indexOf(abaSel);
  document.getElementById('mes-prev').disabled = idx<=0;
  document.getElementById('mes-next').disabled = idx>=abas.length-1;
}

function navMes(dir){
  const idx=abas.indexOf(abaSel);
  const novo=abas[idx+dir];
  if(novo) selecionarAba(novo);
}

function selecionarAba(nome){
  if(nome===abaSel&&rows.length) return;
  abaSel=nome;
  renderPills();
  loadSheet(nome);
}

// ── FETCH ────────────────────────────────────────────────
async function fetchGAS(params) {
  const base = GAS_URL + (params ? '?' + params : '');
  const parse = d => Array.isArray(d) ? {abas:[],rows:d} : d;

  // Estratégia 1: JSONP (mais rápido, sem CORS)
  const jsonp = () => new Promise((resolve, reject) => {
    const cb = '_gas_' + Date.now();
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 12000);
    function cleanup() { clearTimeout(t); delete window[cb]; try{document.head.removeChild(s);}catch(e){} }
    window[cb] = d => { cleanup(); resolve(parse(d)); };
    s.onerror = () => { cleanup(); reject(new Error('jsonp_err')); };
    s.src = base + (params?'&':'?') + 'callback=' + cb;
    document.head.appendChild(s);
  });

  // Estratégia 2: proxy allorigins
  const proxy1 = () => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(base))
    .then(r => r.ok ? r.json() : Promise.reject('proxy1'))
    .then(parse);

  // Estratégia 3: proxy corsproxy
  const proxy2 = () => fetch('https://corsproxy.io/?' + encodeURIComponent(base))
    .then(r => r.ok ? r.json() : Promise.reject('proxy2'))
    .then(parse);

  // Tenta em sequência
  return jsonp()
    .catch(() => proxy1())
    .catch(() => proxy2());
}

// ── LOAD INICIAL ─────────────────────────────────────────
async function load(){
  if(busy) return; busy=true;
  setS('spin','Conectando...');
  try{
    const data = await fetchGAS();
    if(data.abas&&data.abas.length) abas=data.abas;
    if(data.rows) rows=data.rows.filter(r=>r['Operador']&&r['Operador']!=='Operador');
    // Seleciona última aba (mais recente) se não tiver seleção
    if(!abaSel||!abas.includes(abaSel)) abaSel=abas[abas.length-1]||(rows[0]&&rows[0]['_aba'])||'';
    renderPills();
    renderS1();
    renderS2();
    setS('ok','Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    document.getElementById('ld').classList.add('hide');
  }catch(e){
    setS('err','Erro — tente ↺');
    document.getElementById('ld').classList.add('hide');
  }
  busy=false;
}

async function loadSheet(nome){
  if(busy) return; busy=true;
  setS('spin','Carregando '+nome+'...');
  try{
    const data = await fetchGAS('sheet='+encodeURIComponent(nome));
    if(data.abas&&data.abas.length) abas=data.abas;
    if(data.rows) rows=data.rows.filter(r=>r['Operador']&&r['Operador']!=='Operador');
    renderPills();
    renderS1();
    renderS2();
    setS('ok',nome+' · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    setS('err','Erro ao carregar '+nome);
  }
  busy=false;
}

function setS(tp,msg){document.getElementById('sdot').className='sdot '+tp;document.getElementById('stxt').textContent=msg;}

// ── SLIDE 1 ──────────────────────────────────────────────
function renderS1(){
  const totAll=rows.reduce((s,r)=>s+(Number(r['Total'])||0),0);
  const conAll=rows.reduce((s,r)=>s+(Number(r['Concluido'])||0),0);
  const pAll=pct(conAll,totAll);
  document.getElementById('k-pct').textContent=pAll+'%';
  document.getElementById('k-cnt').textContent=conAll+' de '+totAll+' itens';
  setTimeout(()=>{
    const b=document.getElementById('k-bar');
    b.style.width=pAll+'%';
    b.className='bar-fill'+(pAll>=100?' done':'');
  },80);
  const ops={};
  rows.forEach(r=>{
    const op=String(r['Operador']).trim();
    if(!ops[op]) ops[op]={tot:0,con:0};
    ops[op].tot+=Number(r['Total'])||0;
    ops[op].con+=Number(r['Concluido'])||0;
  });
  document.getElementById('s1-ops').innerHTML=Object.entries(ops).map(([op,d],i)=>{
    const p=pct(d.con,d.tot),cls=p>=100?'done':p>0?'part':'',col=COLS[i%COLS.length];
    return `<div class="op ${cls}">
      <div class="op-nm">${opName(op)}</div>
      <div class="op-pct">${p}<span style="font-size:10px;font-weight:400;opacity:.5">%</span></div>
      <div class="op-sub">${d.con}/${d.tot}</div>
      <div class="op-bar"><div class="op-bf" style="width:${p}%;background:${col}"></div></div>
    </div>`;
  }).join('');
  renderEvolChart();
}

function renderEvolChart(){
  const snaps=getSnaps().filter(s=>!abaSel||s.comp===abaSel);
  const wrap=document.getElementById('evol-wrap');
  if(chartEvol){chartEvol.destroy();chartEvol=null;}
  if(!snaps.length){
    wrap.innerHTML='<div class="evol-empty">📸 Registre snapshots para ver a evolução</div>';
    return;
  }
  if(!document.getElementById('chartEvol')) wrap.innerHTML='<canvas id="chartEvol"></canvas>';
  const ordered=[...snaps].reverse();
  const labels=ordered.map(s=>s.dk);
  const operators=[...new Set(snaps.flatMap(s=>Object.keys(s.ops)))];
  const pal=['rgba(74,144,217,1)','rgba(39,174,96,1)','rgba(230,126,34,1)'];
  const datasets=operators.map((op,i)=>{
    const c=pal[i%pal.length];
    return {label:opName(op),data:ordered.map(s=>s.ops[op]?s.ops[op].con:0),borderColor:c,backgroundColor:c.replace(',1)',',0.08)'),tension:.35,fill:false,pointRadius:3,pointBackgroundColor:c,borderWidth:2};
  });
  datasets.unshift({label:'Total',data:ordered.map(s=>Object.values(s.ops).reduce((sum,d)=>sum+d.con,0)),borderColor:'rgba(255,255,255,.5)',backgroundColor:'rgba(255,255,255,.05)',tension:.35,fill:true,pointRadius:3,borderWidth:2,borderDash:[4,3]});
  chartEvol=new Chart(document.getElementById('chartEvol'),{
    type:'line',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:'rgba(202,220,252,.5)',font:{size:8},boxWidth:10,padding:6}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw+' itens'}}},
      scales:{x:{ticks:{color:'rgba(202,220,252,.35)',font:{size:8}},grid:{display:false}},y:{ticks:{color:'rgba(202,220,252,.35)',font:{size:8}},grid:{color:'rgba(255,255,255,.06)'},beginAtZero:true}},
    },
  });
}

// ── SLIDE 2 ──────────────────────────────────────────────
function renderS2(){
  const grps={};
  rows.forEach(r=>{
    const g=String(r['Grupo']).trim(),a=String(r['Atividade']).trim();
    if(!grps[g]) grps[g]={};
    if(!grps[g][a]) grps[g][a]={tot:0,con:0};
    grps[g][a].tot+=Number(r['Total'])||0;
    grps[g][a].con+=Number(r['Concluido'])||0;
  });
  document.getElementById('s2-g').innerHTML=Object.entries(grps).map(([g,atvs])=>{
    const totG=Object.values(atvs).reduce((s,a)=>s+a.tot,0);
    const conG=Object.values(atvs).reduce((s,a)=>s+a.con,0);
    const pG=pct(conG,totG);
    const stG=totG===0?'none':pG>=100?'done':pG>0?'part':'zero';
    const bCls={'done':'gb-done','part':'gb-part','zero':'gb-zero','none':'gb-none'}[stG];
    const bTxt={'done':'✅ Concluído','part':'⏳ Parcial','zero':'❌ Pendente','none':'➖ Sem demanda'}[stG];
    const aRows=Object.entries(atvs).map(([a,d])=>{
      const p=pct(d.con,d.tot),col=p>=100?'#27AE60':p>0?'#4A90D9':d.tot===0?'rgba(202,220,252,.15)':'#E74C3C';
      return `<div class="arow"><span class="anm">${a}</span><div class="abar"><div class="abf" style="width:${p}%;background:${col}"></div></div><span class="acnt">${d.tot?d.con+'/'+d.tot:'—'}</span><span class="apct" style="color:${col}">${d.tot?p+'%':'—'}</span></div>`;
    }).join('');
    return `<div class="gblk"><div class="ghd"><span class="gnm">${g}</span><span class="gbadge ${bCls}">${bTxt}</span></div>${aRows}</div>`;
  }).join('');
}

// ── SLIDE 3 ──────────────────────────────────────────────
function renderS3(){
  const snaps=getSnaps();
  const comps=[...new Set(snaps.map(s=>s.comp).filter(Boolean))].sort();
  document.getElementById('h3-sub').textContent=snaps.length+' snapshot'+(snaps.length!==1?'s':'')+' · '+comps.length+' competência'+(comps.length!==1?'s':'');
  document.getElementById('h-ft').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  // Pills filtro
  document.getElementById('hist-filter').innerHTML=
    [{'label':'Todos','val':'todos'},...comps.map(c=>({'label':c,'val':c}))]
    .map(f=>`<button class="hfpill${histFiltro===f.val?' active':''}" onclick="setFiltro('${f.val}')">${f.label}</button>`)
    .join('');
  const snapsFilt=histFiltro==='todos'?snaps:snaps.filter(s=>s.comp===histFiltro);
  renderRanking(snapsFilt);
  if(!snapsFilt.length){
    document.getElementById('h-chart-box').style.display='none';
    document.getElementById('s3-snaps').innerHTML=`<div class="h-empty"><div class="ic">📭</div><p>Nenhum snapshot para esta seleção.<br>Toque em <strong>📸 Registrar</strong> para salvar.</p></div>`;
    return;
  }
  document.getElementById('h-chart-box').style.display='block';
  document.getElementById('h-chart-title').textContent='Evolução % · '+(histFiltro==='todos'?'Todos os meses':histFiltro);
  const operators=[...new Set(snapsFilt.flatMap(s=>Object.keys(s.ops)))];
  const pal=['rgba(74,144,217,1)','rgba(39,174,96,1)','rgba(230,126,34,1)','rgba(155,89,182,1)'];
  const labels=[...snapsFilt].reverse().map(s=>s.dk+(s.comp&&histFiltro==='todos'?' ('+s.comp+')':''));
  const datasets=operators.map((op,i)=>{
    const c=pal[i%pal.length];
    return {label:opName(op),data:[...snapsFilt].reverse().map(s=>{const d=s.ops[op];return d?pct(d.con,d.tot):0;}),borderColor:c,backgroundColor:c.replace(',1)',',0.1)'),tension:.32,fill:true,pointRadius:4,pointBackgroundColor:c};
  });
  if(chartH){chartH.destroy();chartH=null;}
  chartH=new Chart(document.getElementById('chartH'),{
    type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#6B7A99',font:{family:'Inter',size:10}}}},scales:{x:{ticks:{color:'#94A3B8',font:{size:9}},grid:{color:'rgba(30,39,97,.08)'}},y:{ticks:{color:'#94A3B8',callback:v=>v+'%'},grid:{color:'rgba(30,39,97,.08)'},min:0,max:100}}}});
  document.getElementById('s3-snaps').innerHTML=snapsFilt.map((s,i)=>{
    const prev=snapsFilt[i+1];
    const time=new Date(s.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const opHtml=Object.entries(s.ops).map(([op,d])=>{
      const p=pct(d.con,d.tot);
      let dh='';
      if(prev&&prev.ops[op]){
        const pp=pct(prev.ops[op].con,prev.ops[op].tot),dl=p-pp,dc=dl>0?'#27AE60':dl<0?'#EF4444':'#94A3B8';
        const deltaCon=d.con-(prev.ops[op].con||0);
        dh=`<div class="sc-dlt" style="color:${dc}">${dl>0?'+':''}${dl}% (${deltaCon>0?'+':''}${deltaCon} itens)</div>`;
      }
      return `<div><div class="sc-nm">${opName(op)}</div><div class="sc-pct">${p}%</div><div class="sc-cnt">${d.con}/${d.tot}</div>${dh}</div>`;
    }).join('');
    return `<div class="scard"><div class="sc-hd"><span class="sc-dt">📅 ${s.dk} · ${time}</span><div class="sc-tags">${s.comp?`<span class="sc-tag comp">${s.comp}</span>`:''}<span class="sc-tag">${s.trig==='auto'?'🤖 Auto':'👆 Manual'}</span></div></div><div class="sc-ops">${opHtml}</div></div>`;
  }).join('');
}

function setFiltro(val){histFiltro=val;renderS3();}

function renderRanking(snapsFilt){
  const opData={};
  if(rows.length){
    rows.forEach(r=>{const op=String(r['Operador']).trim();if(!opData[op])opData[op]={tot:0,con:0};opData[op].tot+=Number(r['Total'])||0;opData[op].con+=Number(r['Concluido'])||0;});
  } else if(snapsFilt.length){
    Object.entries(snapsFilt[0].ops).forEach(([op,d])=>opData[op]=d);
  }
  const sorted=Object.entries(opData).map(([op,d])=>{return{op,p:pct(d.con,d.tot),con:d.con,tot:d.tot};} ).sort((a,b)=>b.p-a.p||b.con-a.con);
  const top3=sorted.slice(0,3),maxP=top3[0]?.p||1;
  const barColors=['#F59E0B','#94A3B8','#B45309'];
  document.getElementById('ranking').innerHTML=top3.length?
    top3.map((item,i)=>`<div class="rank-item"><div class="rank-medal">${MEDALS[i]}</div><div class="rank-info"><div class="rank-nome">${opName(item.op)}</div><div class="rank-bar-t"><div class="rank-bar-f" style="width:${Math.round(item.p/maxP*100)}%;background:${barColors[i]}"></div></div></div><div class="rank-nums"><div class="rank-pct">${item.p}%</div><div class="rank-cnt">${item.con}/${item.tot}</div></div></div>`).join(''):
    '<div style="color:#94A3B8;font-size:12px;text-align:center;padding:10px;">Atualize para ver o ranking</div>';
}

// ── SNAPSHOTS ────────────────────────────────────────────
function getSnaps(){try{return JSON.parse(localStorage.getItem(SKEY)||'[]');}catch{return[];}}
function saveSnaps(s){localStorage.setItem(SKEY,JSON.stringify(s));}
function buildOps(){const o={};rows.forEach(r=>{const op=String(r['Operador']).trim();if(!o[op])o[op]={tot:0,con:0};o[op].tot+=Number(r['Total'])||0;o[op].con+=Number(r['Concluido'])||0;});return o;}

function takeSnap(trig='manual'){
  if(!rows.length) return;
  const now=new Date();
  const snap={ts:now.toISOString(),dk:now.toLocaleDateString('pt-BR'),trig,comp:abaSel,ops:buildOps()};
  const ss=getSnaps();
  if(trig==='auto'){const i=ss.findIndex(s=>s.dk===snap.dk&&s.trig==='auto'&&s.comp===snap.comp);if(i>=0)ss[i]=snap;else ss.unshift(snap);}
  else ss.unshift(snap);
  saveSnaps(ss);
  renderEvolChart();
  renderS3();
  const btn=document.querySelector('.sbtn-s'),orig=btn.textContent;
  btn.textContent='✅ Salvo!';setTimeout(()=>btn.textContent=orig,2000);
}

function autoCheck(){
  const now=new Date(),k=now.toLocaleDateString('pt-BR');
  if(now.getHours()===0&&now.getMinutes()===0&&localStorage.getItem(AKEY)!==k){
    localStorage.setItem(AKEY,k);load().then(()=>takeSnap('auto'));
  }
}

function startCD(){
  clearInterval(cdT);cd=RSEC;
  cdT=setInterval(()=>{
    cd--;
    const el=document.getElementById('ctxt');
    if(el) el.textContent=Math.floor(cd/60)+':'+String(cd%60).padStart(2,'0');
    autoCheck();
    if(cd<=0&&!busy) load().then(startCD);
  },1000);
}

function manualRefresh(){clearInterval(cdT);load().then(startCD);}
load().then(startCD);
</script>
